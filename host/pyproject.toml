[project]
name = "lightgun-host"
version = "0.1.0"
description = "PC host for the Phone Light Gun"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "PySide6>=6.6", "qrcode>=7.4", "opencv-python>=4.8",
  "evdev>=1.6; sys_platform == 'linux'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lightgun-host = "lightgun_host.app:main"

[tool.setuptools]
packages = ["lightgun_host", "lightgun_host.inject"]

[tool.pytest.ini_options]
testpaths = ["tests"]
