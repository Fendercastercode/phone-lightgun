name: Release host build

# Fires on a version tag (v1.2.3). Builds the PhoneBlaster host with PyInstaller for
# Windows, Linux (x86_64), and 64-bit Raspberry Pi OS (aarch64), packages each, writes a
# SHA256SUMS.txt, and attaches everything to a GitHub Release - along with a signed
# build-provenance attestation (via GitHub's own Sigstore-backed attestation service)
# proving each artifact was built by this exact workflow run from this exact commit.
#
# Not covered, on purpose:
#   - 32-bit Raspberry Pi OS (armv7l - older Pi models, or a 32-bit install on a newer
#     one). scipy/opencv-python/PySide6 don't reliably publish prebuilt armv7l wheels,
#     which means a from-source compile that's both slow and failure-prone on CI (and on
#     the Pi itself). Point those users at start-host.sh instead (it builds locally,
#     slowly, with whatever wheels/compilers are available on their system) rather than
#     promising a prebuilt binary CI can't reliably produce.
#   - Windows Authenticode signing: SmartScreen does not read attestations, so this alone
#     will not stop the "Windows protected your PC" warning on a fresh install. See the
#     commented step in build-windows below for where that goes once set up (SignPath
#     free-for-OSS signing, or Azure Trusted Signing).

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write      # to create the GitHub Release
  id-token: write       # required by attest-build-provenance (Sigstore OIDC)
  attestations: write   # required by attest-build-provenance

jobs:
  build-windows:
    name: Build Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: host/requirements-build.txt

      - name: Install dependencies
        working-directory: host
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run tests
        working-directory: host
        run: python -m pytest -q

      - name: Freeze with PyInstaller
        working-directory: host
        run: pyinstaller pyinstaller.spec

      # - name: Sign PhoneBlaster.exe
      #   # Uncomment once a signing path is set up (SignPath free-for-OSS, or Azure
      #   # Trusted Signing). Never add raw certificate files/passwords as repo secrets
      #   # here - both of those services sign via a short-lived token/OIDC flow instead.
      #   run: echo "signing step goes here"

      - name: Package release zip
        working-directory: host/dist
        run: Compress-Archive -Path PhoneBlaster -DestinationPath PhoneBlaster-windows-${{ github.ref_name }}.zip

      - name: Write checksum
        working-directory: host/dist
        run: |
          $hash = Get-FileHash PhoneBlaster-windows-${{ github.ref_name }}.zip -Algorithm SHA256
          "$($hash.Hash.ToLower())  PhoneBlaster-windows-${{ github.ref_name }}.zip" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "host/dist/PhoneBlaster-windows-${{ github.ref_name }}.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            host/dist/PhoneBlaster-windows-${{ github.ref_name }}.zip
            host/dist/SHA256SUMS.txt
          generate_release_notes: true

  build-linux:
    name: Build Linux host (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 desktop/laptop Linux.
          - arch: x86_64
            runner: ubuntu-22.04
          # 64-bit Raspberry Pi OS on a Pi 4/5 (not 32-bit Pi OS - see the note at the top
          # of this file). ubuntu-24.04-arm is a native arm64 GitHub-hosted runner (free
          # for public repos), so this is a real aarch64 build, not QEMU-emulated.
          - arch: aarch64-raspi
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: host/requirements-build.txt

      - name: System build dependencies
        # Only needed to build the frozen binary here in CI (evdev has a small C
        # extension). End users downloading the finished release need none of this.
        run: sudo apt-get update && sudo apt-get install -y build-essential python3-dev

      - name: Install dependencies
        working-directory: host
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run tests
        working-directory: host
        run: python -m pytest -q

      - name: Freeze with PyInstaller
        working-directory: host
        run: pyinstaller pyinstaller.spec

      - name: Package release tarball
        working-directory: host
        run: |
          mkdir -p pkg
          cp -r dist/PhoneBlaster pkg/
          cp install-linux.sh pkg/
          chmod +x pkg/install-linux.sh pkg/PhoneBlaster/PhoneBlaster
          tar -C pkg -czf dist/PhoneBlaster-linux-${{ matrix.arch }}-${{ github.ref_name }}.tar.gz PhoneBlaster install-linux.sh

      - name: Write checksum
        working-directory: host/dist
        run: sha256sum PhoneBlaster-linux-${{ matrix.arch }}-${{ github.ref_name }}.tar.gz > SHA256SUMS-${{ matrix.arch }}.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "host/dist/PhoneBlaster-linux-${{ matrix.arch }}-${{ github.ref_name }}.tar.gz"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            host/dist/PhoneBlaster-linux-${{ matrix.arch }}-${{ github.ref_name }}.tar.gz
            host/dist/SHA256SUMS-${{ matrix.arch }}.txt
          generate_release_notes: true
